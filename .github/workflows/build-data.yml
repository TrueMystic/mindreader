name: build-data
on:
  workflow_dispatch:
  push:
    paths: ["tools/build_data.py", ".github/workflows/build-data.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_data.py
        continue-on-error: true
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update game data from Wikidata" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push
