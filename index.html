<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MindReader AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Golos+Text:wght@400;600&display=swap">
<style>
/* Один экран, один крупный элемент по центру; тёмная «машинная» сцена */
:root{
  --bg:#0b0714; --bg2:#1d0b33; --fg:#f4f0ff; --muted:#a99cc4;
  --accent:#ff3d8b; --accent2:#8f4dff;
  --display:"Russo One","Arial Black",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg) 70%);
  background-color:var(--bg);
  color:var(--fg);font-family:var(--body);font-size:17px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-tap-highlight-color:transparent;
}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding-block:24px}
.screen[hidden]{display:none!important}
h1,.title{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:clamp(30px,8vw,40px)}
.title{font-size:clamp(34px,10vw,46px)}
.sub{color:var(--muted);font-size:19px;margin:0;line-height:1.4;white-space:pre-line}
.big{font-size:96px;line-height:1}
.huge{font-size:140px;line-height:1}
.count{font-family:var(--display);font-size:120px;line-height:1;font-variant-numeric:tabular-nums}
.bar{width:100%;height:12px;border-radius:6px;background:#ffffff1a;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.top{display:flex;justify-content:center;padding-top:16px}
.seg{display:flex;border:1px solid #ffffff2e;border-radius:10px;overflow:hidden}
.seg button{background:transparent;color:var(--muted);border:0;font:600 15px var(--body);padding:8px 18px;cursor:pointer}
.seg button.on{background:#ffffff1f;color:var(--fg)}
.btn{width:100%;border:0;border-radius:18px;padding:18px;font:400 22px var(--display);color:#fff;cursor:pointer;
  background:linear-gradient(90deg,var(--accent),var(--accent2));margin-bottom:24px}
.btn:focus-visible,.seg button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
#dbg{font:12px ui-monospace,monospace;color:var(--muted);white-space:pre-wrap;max-height:30vh;overflow:auto;margin:0 0 16px}
.spin{width:56px;height:56px;border-radius:50%;border:5px solid #ffffff2a;border-top-color:var(--accent);animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.pop{animation:p .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes p{from{transform:scale(.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.spin,.pop{animation:none}}
</style>
</head>
<body>
<div class="app">
  <div class="top" id="langbar">
    <div class="seg" role="group" aria-label="Language">
      <button id="lang-ru" type="button">RU</button>
      <button id="lang-en" type="button">EN</button>
    </div>
  </div>

  <section class="screen" id="s-intro">
    <div class="big">🤖</div>
    <h1 data-t="intro"></h1>
    <p class="sub" data-t="intro2"></p>
  </section>

  <section class="screen" id="s-listen" hidden>
    <div class="title" id="cat"></div>
    <p class="sub" data-t="say"></p>
    <div class="count" id="count">6</div>
    <div class="bar"><i id="bar"></i></div>
  </section>

  <section class="screen" id="s-think" hidden>
    <div class="spin"></div>
    <div class="title" style="font-size:28px" data-t="think"></div>
  </section>

  <section class="screen" id="s-result" hidden>
    <p class="sub" id="r-label"></p>
    <div class="huge pop" id="r-emoji"></div>
    <div class="title" id="r-name"></div>
    <p class="sub" id="r-tag"></p>
  </section>

  <section class="screen" id="s-miss" hidden>
    <div class="big">🤔</div>
    <div class="title" style="font-size:30px" data-t="miss"></div>
    <p class="sub" data-t="miss2"></p>
  </section>

  <section class="screen" id="s-err" hidden>
    <div class="big">🔒</div>
    <div class="title" style="font-size:26px" id="err-title"></div>
    <p class="sub" id="err-text"></p>
  </section>

  <button class="btn" id="go" type="button"></button>
  <pre id="dbg" hidden></pre>
</div>

const DURATION = 6000;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const DEBUG = location.hash === "#debug";
const $ = id => document.getElementById(id);
let lang = "ru";
try { lang = localStorage.getItem("lang") || "ru"; } catch(e){}
let phase = "intro", cat = null, found = null, rec = null, runId = 0;
let doneText = "", curText = "", lastErr = "";
const heard = () => doneText + " " + curText;

function log(msg){
  if (!DEBUG) return;
  const d = $("dbg"); d.hidden = false;
  d.textContent = (new Date().toISOString().slice(17,23) + " " + msg + "\n" + d.textContent).slice(0, 1500);
}

const norm = s => s.toLowerCase().replace(/ё/g,"е");
function match(category, text){
  const words = norm(text).split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  const glued = words.join("");
  let best = null, score = 0;
  for (const it of category.items) for (const raw of it[3]) {
    const k = norm(raw); let hit = false;
    if (/[ -]/.test(k)) hit = glued.includes(k.replace(/[^\p{L}\p{N}]/gu,""));
    else if (k.endsWith("*")) { const st = k.slice(0,-1); hit = words.some(w => w.startsWith(st)); }
    else hit = words.includes(k);
    if (hit && k.length > score) { best = it; score = k.length; }
  }
  return best;
}

function show(p){
  phase = p;
  for (const s of ["intro","listen","think","result","miss","err"]) $("s-"+s).hidden = s !== p;
  $("langbar").style.visibility = p === "intro" ? "visible" : "hidden";
  $("go").hidden = p === "listen" || p === "think";
  $("go").textContent = T[lang][p === "intro" ? "start" : "again"];
}
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = T[lang][el.dataset.t]);
  $("lang-ru").classList.toggle("on", lang==="ru");
  $("lang-en").classList.toggle("on", lang==="en");
  show(phase);
}
$("lang-ru").onclick = () => { lang="ru"; try{localStorage.setItem("lang",lang)}catch(e){} applyLang(); };
$("lang-en").onclick = () => { lang="en"; try{localStorage.setItem("lang",lang)}catch(e){} applyLang(); };

function err(title, text){ $("err-title").textContent = title; $("err-text").textContent = text; show("err"); }
function stopRec(){
  if (!rec) return;
  const r = rec; rec = null;
  r.onend = r.onresult = r.onerror = null;
  try { r.stop(); } catch(e){}
  setTimeout(() => { try { r.abort(); } catch(e){} }, 300);
}

function makeRec(id, onLive){
  const r = new SR();
  r.lang = lang === "ru" ? "ru-RU" : "en-US";
  r.continuous = !IOS;          // на iPhone непрерывный режим глючит — перезапускаем вручную
  r.interimResults = true;
  r.maxAlternatives = 1;
  r.onstart = () => { log("start"); onLive && onLive(); };
  r.onaudiostart = () => { log("audio"); onLive && onLive(); };
  r.onresult = e => {
    let t = "";
    for (let i = 0; i < e.results.length; i++) t += " " + e.results[i][0].transcript;
    curText = t;
    log("heard: " + t.trim());
  };
  r.onerror = e => {
    lastErr = e.error; log("error: " + e.error);
    if (id !== runId) return;
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      runId++; stopRec(); err(T[lang].denied, T[lang].denied2);
    }
  };
  r.onend = () => {
    log("end");
    if (id !== runId || phase !== "listen" || rec !== r) return;
    doneText += " " + curText; curText = "";
    try { r.start(); }
    catch(e) { try { rec = makeRec(id); rec.start(); } catch(e2){ log("restart fail"); } }
  };
  return r;
}

function startRound(){
  if (!SR) return err(T[lang].noApi, T[lang].noApi2);
  const id = ++runId;
  stopRec();
  const others = CATS.filter(c => c !== cat);
  cat = others[Math.floor(Math.random()*others.length)];
  found = null; doneText = ""; curText = ""; lastErr = "";
  $("cat").textContent = cat[lang];
  $("count").textContent = String(DURATION/1000); $("bar").style.width = "0";

  // Отсчёт начинается, только когда микрофон реально включился
  let t0 = 0;
  const go = () => { if (!t0 && id === runId) { t0 = performance.now(); requestAnimationFrame(tick); } };
  rec = makeRec(id, go);
  try { rec.start(); } catch(e) { log("start fail " + e); return err(T[lang].noApi, T[lang].noApi2); }
  show("listen");
  setTimeout(go, 2500);

  let matchedAt = 0, lastH = "", lastChange = 0;
  function tick(now){
    if (id !== runId) return;
    const el = Math.max(0, now - t0), p = Math.min(el/DURATION, 1);
    $("bar").style.width = (p*100) + "%";
    $("count").textContent = Math.max(0, Math.ceil((DURATION - el)/1000));
    const h = heard();
    if (h !== lastH) { lastH = h; lastChange = now; }
    const m = matchAny(h);
    if (m) { found = m; if (!matchedAt) matchedAt = now; }
    const paused = h.trim() && now - lastChange > 1300;   // человек сказал и замолчал
    if (el >= DURATION + 400 || (matchedAt && now - matchedAt > 900) || paused) return finish(id);
    requestAnimationFrame(tick);
  }
}

// Сначала ищем в текущей категории, потом во всех остальных
function matchAny(text){
  const m = match(cat, text); if (m) return m;
  for (const c of CATS) { const x = match(c, text); if (x) return x; }
  return null;
}
// Слова нет в списке — показываем само сказанное слово
const FILLER = new Set(["ну","эм","ээ","э","мм","хм","это","так","наверное","может","пусть","будет","я","загадал","загадала","думаю","наверно","давай","скажем","ой","а","и",
  "um","uh","er","hmm","well","i","think","guess","maybe","let","say","is","it","the","a","an","my","choose","pick","picked","so","like"]);
function rawGuess(text){
  const words = text.trim().split(/\s+/).filter(w => w && !FILLER.has(norm(w).replace(/[^\p{L}\p{N}-]/gu,"")));
  if (!words.length) return null;
  const pick = words.slice(-2).join(" ").replace(/[.,!?…]+$/,"");
  if (!pick) return null;
  const name = pick.charAt(0).toUpperCase() + pick.slice(1);
  const emoji = {"Уличная еда":"🍽️","Марка машины":"🚗","Животное":"🐾","Фрукт":"🧺","Страна":"🌍","Цветок":"💐","Цвет":"🎨"}[cat.ru] || "🎯";
  return [name, name, emoji, []];
}

function finish(id){
  const text = heard();
  stopRec();
  show("think");
  setTimeout(() => {
    if (id !== runId) return;
    const all = text + " " + curText;
    // В категории → обычный ответ; известное слово из другой категории → «это не из категории»;
    // незнакомое слово → просто показываем его
    const inCat = match(cat, all);
    const other = inCat ? null : matchAny(all);
    found = inCat || other || rawGuess(curText.trim() ? curText : all);
    log("final: " + (text.trim() || "(пусто)") + (lastErr ? " | err " + lastErr : ""));
    if (found) {
      const em = $("r-emoji"); em.textContent = found[2];
      em.classList.remove("pop"); void em.offsetWidth; em.classList.add("pop");
      $("r-name").textContent = lang === "ru" ? found[0] : found[1];
      $("r-label").textContent = other ? T[lang].off.replace("{c}", cat[lang]) : T[lang].picked;
      const tags = other ? T[lang].offTags : T[lang].tags; $("r-tag").textContent = tags[Math.floor(Math.random()*tags.length)];
      show("result");
    } else show("miss");
  }, 1300);
}

$("go").onclick = startRound;
applyLang();
</script>
